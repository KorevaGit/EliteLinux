# EliteLinux: настройки GoPro как веб-камеры (elite-gopro-webcam)
# Разрешение: 4 = 480p, 7 = 720p, 12 = 1080p. На слабых ПК (A6) — 720p: декодирование
# 1080p заметно грузит процессор.
GOPRO_RES=7
# Угол обзора: 0 = широкий, 2 = узкий, 3 = суперузкий, 4 = линейный (без «рыбьего глаза»)
GOPRO_FOV=4
GOPRO_PORT=8554
GOPRO_VIDEO=/dev/video42
