# EliteLinux: подключённые наушники, гарнитура или микрофон (USB, Bluetooth, разъём)
# сразу становятся устройством по умолчанию — без ручного переключения в настройках звука.
# Отключили гарнитуру — звук возвращается на прежнее устройство.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ "nofail" ] }
]
