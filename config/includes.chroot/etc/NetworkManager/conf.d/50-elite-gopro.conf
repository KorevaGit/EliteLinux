# EliteLinux: USB-сеть GoPro — только для камеры, не маршрут в интернет: низкий приоритет
# маршрута (never-default в conf.d не поддерживается; маршрут по умолчанию на сети камеры
# дополнительно убирает elite-gopro-webcam)
[connection-elite-gopro]
match-device=driver:cdc_ncm,driver:cdc_ether,driver:rndis_host
ipv4.route-metric=30000
ipv6.route-metric=30000
