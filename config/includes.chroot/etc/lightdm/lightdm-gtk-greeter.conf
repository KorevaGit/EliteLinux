# EliteLinux: экран входа — окно ввода по центру, логотип над ним (нарисован в фоне),
# учётки выбираются по отображаемым именам «Менеджер» / «Администратор».
[greeter]
background=/usr/share/backgrounds/elite/elite-login-bg.png
user-background=false
# своя тема: всплывающий список учёток без чёрных углов (theme/elite-greeter.css)
theme-name=Elite-Greeter
icon-theme-name=Elite
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
position=50%,center 62%,center
panel-position=top
indicators=~host;~spacer;~clock;~spacer;~layout;~power
clock-format=%H:%M   %d.%m.%Y
# аватар выбранной учётки слева от поля пароля (AccountsService, elite-postinstall)
hide-user-image=false
default-user-image=/usr/share/pixmaps/elite-avatar.png
keyboard=
a11y-states=
