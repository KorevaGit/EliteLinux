# EliteLinux: после копирования системы убираем всё, что нужно только live-флешке
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares'
      - 'calamares-settings-debian'
      - 'user-setup'
