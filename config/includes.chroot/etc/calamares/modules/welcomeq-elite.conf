# EliteLinux: экран «Добро пожаловать» — логотип, железо ПК, проверка требований (наш
# QML branding/elite/elite-welcome.qml). Модуль welcomeq, а не notesqml: только модуль
# приветствия при старте ставит язык и переподписывает кнопки — с notesqml «Назад /
# Далее / Отмена» на первом экране оставались английскими.
---
qmlSearch: both
qmlFilename: elite-welcome
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false
# требования проверяет и показывает сам экран (предупреждения, без блокировки)
requirements:
    requiredStorage: 0
    requiredRam:     0
    check: []
    required: []
geoip:
    style: "none"
