# EliteLinux: учётки, имя компьютера, паспорт ПК — внутри установленной системы
---
dontChroot: false
timeout: 300
script:
    - command: "/usr/lib/elite/elite-postinstall"
      timeout: 300
    # EliteLinux первым в порядке загрузки UEFI (после модуля bootloader)
    - command: "/usr/lib/elite/elite-efi-bootorder"
      timeout: 30
i18n:
    name: "Настройка EliteLinux"
