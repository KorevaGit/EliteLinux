# EliteLinux: установщик Calamares.
# Показываем только 3 экрана (приветствие, диск, установка) и финал; язык, раскладка,
# часовой пояс и учётки не спрашиваются — их задаёт elite-postinstall
# (страниц locale/keyboard нет, поэтому и их задания тоже не запускаем).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     elite
  module: shellprocess
  config: shellprocess-elite.conf
- id:     elite
  module: notesqml
  config: notesqml-elite.conf

sequence:
- show:
  - notesqml@elite
  - partition
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - shellprocess@elite
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: elite
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
