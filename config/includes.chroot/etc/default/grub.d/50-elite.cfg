# EliteLinux: графическая заставка Plymouth вместо текстового лога загрузки
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3"
GRUB_TIMEOUT=2
# меню скрыто — сразу заставка Plymouth; открыть меню: Esc при загрузке
GRUB_TIMEOUT_STYLE=hidden
# вместо стандартного фона Debian (desktop-base) — графитовый фон EliteLinux
GRUB_BACKGROUND=/usr/share/plymouth/themes/elite/background.png
GRUB_DISTRIBUTOR="EliteLinux"
