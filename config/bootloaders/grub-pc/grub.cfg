# EliteLinux: загрузочное меню флешки.
# Если на дисках компьютера найдена установленная EliteLinux (/etc/elite-release),
# по умолчанию загружается она — на случай, если флешку забыли извлечь после установки.
source /boot/grub/config.cfg

insmod part_msdos
insmod part_gpt
insmod ext2
set timeout=5
set timeout_style=menu

search --no-floppy --file --set=elite_disk /etc/elite-release
if [ -n "$elite_disk" ]; then
    set default=elite-disk
    # Загрузка передаётся собственному загрузчику системы целиком (chainloader), а не
    # читается её grub.cfg: иначе она наследует видеорежим меню флешки и ядро
    # зависает (проверено в виртуалке 27.10.2026). Так система грузится ровно как без флешки.
    menuentry "Загрузить установленную EliteLinux" --id elite-disk {
        if [ "${grub_platform}" = "efi" ]; then
            insmod fat
            insmod chain
            # /EFI/BOOT/BOOTX64.EFI не перебираем: такой есть и на самой флешке
            for f in /EFI/EliteLinux/grubx64.efi /EFI/debian/grubx64.efi; do
                if search --no-floppy --file --set=elite_esp $f; then
                    chainloader ($elite_esp)$f
                    boot
                fi
            done
        else
            insmod chain
            insmod regexp
            regexp --set=1:elite_drive '^([^,]+)' "$elite_disk"
            set root=($elite_drive)
            chainloader +1
        fi
    }
else
    set default=elite-install
fi

menuentry "Установить EliteLinux" --id elite-install {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ elite.install
    initrd @INITRD_LIVE@
}

menuentry "Запустить без установки" --id elite-live {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Настройки UEFI" --id elite-uefi {
        fwsetup
    }
fi
