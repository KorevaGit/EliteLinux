# EliteLinux: загрузочное меню флешки.
# Если на дисках компьютера найдена установленная EliteLinux (/etc/elite-release),
# по умолчанию загружается она — на случай, если флешку забыли извлечь после установки.
source /boot/grub/config.cfg

insmod part_msdos
insmod part_gpt
insmod ext2
set timeout=5
set timeout_style=menu

search --no-floppy --file --set=elite_disk /etc/elite-release
if [ -n "$elite_disk" ]; then
    set default=elite-disk
    menuentry "Загрузить установленную EliteLinux" --id elite-disk {
        set root=$elite_disk
        configfile /boot/grub/grub.cfg
    }
else
    set default=elite-install
fi

menuentry "Установить EliteLinux" --id elite-install {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ elite.install
    initrd @INITRD_LIVE@
}

menuentry "Запустить без установки" --id elite-live {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Настройки UEFI" --id elite-uefi {
        fwsetup
    }
fi
