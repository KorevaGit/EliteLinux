# EliteLinux: графический режим загрузочного меню.
# В шаблоне live-build меню на BIOS уходило в текстовый режим по двум причинам:
# не подгружался видеодрайвер vbe, а `loadfont unicode` ищет /boot/grub/fonts/,
# тогда как на ISO шрифт лежит в /boot/grub/unicode.pf2 — терминалу не хватало шрифта.
insmod all_video
insmod gfxterm
insmod png
loadfont $prefix/unicode.pf2
set gfxmode=1024x768,auto
set gfxpayload=keep
source /boot/grub/theme.cfg
terminal_output gfxterm
