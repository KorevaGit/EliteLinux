# EliteLinux: графический режим загрузочного меню.
# Меню на BIOS уходило в текстовый режим: не подгружался видеодрайвер vbe, а терминал
# GRUB брал первый загруженный шрифт — крупный Inter темы — и падал с «glyphs too large
# to fit on screen». Поэтому шрифт терминала задан явно (Unifont из /boot/grub).
insmod all_video
insmod gfxterm
insmod png
loadfont $prefix/unicode.pf2
set gfxterm_font="GNU Unifont Regular 16"
set gfxmode=1024x768,auto
# gfxpayload=keep не ставим: если графика GRUB не включилась, ядро получает мусорный
# видеорежим (efifb 65363x65363) и зависает. Графику ядру включает свой драйвер (KMS).
source /boot/grub/theme.cfg
terminal_output gfxterm
