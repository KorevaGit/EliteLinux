<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- EliteLinux: аватар «Менеджер» — менеджер в аниме-стиле, графит и золото -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="1" stop-color="#18181a"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343c52"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f2a"/>
      <stop offset="1" stop-color="#211a17"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="246"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <g clip-path="url(#circle)">
    <!-- плечи и пиджак -->
    <path d="M70 520 C84 418 160 376 256 376 C352 376 428 418 442 520 Z" fill="url(#suit)"/>
    <!-- рубашка -->
    <path d="M210 376 L256 470 L302 376 Z" fill="#f2f2f4"/>
    <!-- лацканы -->
    <path d="M206 376 L256 470 L226 520 L180 520 L188 430 Z" fill="#1d2230"/>
    <path d="M306 376 L256 470 L286 520 L332 520 L324 430 Z" fill="#1d2230"/>
    <!-- галстук -->
    <path d="M246 388 L266 388 L270 404 L258 404 Z" fill="#b08236"/>
    <path d="M248 402 L264 402 L274 470 L256 490 L238 470 Z" fill="#d4b06a"/>
    <!-- шея -->
    <path d="M226 318 L286 318 L290 380 Q256 400 222 380 Z" fill="#e7bba1"/>
    <!-- уши -->
    <ellipse cx="167" cy="262" rx="13" ry="22" fill="#f3cfb8"/>
    <ellipse cx="345" cy="262" rx="13" ry="22" fill="#f3cfb8"/>
    <!-- лицо: острый «аниме» подбородок -->
    <path d="M168 226 Q166 318 256 356 Q346 318 344 226 Q342 146 256 142 Q170 146 168 226 Z" fill="#f8dcc8"/>
    <!-- волосы с чёлкой -->
    <path d="M156 252 Q132 150 206 112 Q256 86 314 106 Q384 132 358 252
             L346 214 Q340 182 322 176 L314 206 L292 168 L276 204 L254 162 L234 204 L216 170
             L200 212 L184 184 Q170 206 168 252 Z" fill="url(#hair)"/>
    <path d="M206 122 Q246 104 296 116" fill="none" stroke="#5a4a40" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- брови -->
    <path d="M196 226 Q216 216 236 224" fill="none" stroke="#2a211c" stroke-width="6" stroke-linecap="round"/>
    <path d="M276 224 Q296 216 316 226" fill="none" stroke="#2a211c" stroke-width="6" stroke-linecap="round"/>
    <!-- глаза: крупные, с бликами -->
    <ellipse cx="218" cy="262" rx="17" ry="23" fill="#ffffff"/>
    <ellipse cx="294" cy="262" rx="17" ry="23" fill="#ffffff"/>
    <ellipse cx="220" cy="265" rx="13" ry="19" fill="#7a5530"/>
    <ellipse cx="292" cy="265" rx="13" ry="19" fill="#7a5530"/>
    <ellipse cx="220" cy="268" rx="7" ry="11" fill="#2a1d14"/>
    <ellipse cx="292" cy="268" rx="7" ry="11" fill="#2a1d14"/>
    <circle cx="214" cy="255" r="5.5" fill="#ffffff"/>
    <circle cx="286" cy="255" r="5.5" fill="#ffffff"/>
    <circle cx="225" cy="276" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="297" cy="276" r="2.5" fill="#ffffff" opacity="0.8"/>
    <path d="M198 246 Q218 232 240 246" fill="none" stroke="#2a211c" stroke-width="6" stroke-linecap="round"/>
    <path d="M272 246 Q294 232 314 246" fill="none" stroke="#2a211c" stroke-width="6" stroke-linecap="round"/>
    <!-- нос, румянец, улыбка -->
    <path d="M256 284 L252 300 L258 301" fill="none" stroke="#d9a58c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="200" cy="300" rx="16" ry="8" fill="#f2a0a0" opacity="0.45"/>
    <ellipse cx="312" cy="300" rx="16" ry="8" fill="#f2a0a0" opacity="0.45"/>
    <path d="M236 318 Q256 334 276 318" fill="none" stroke="#b5615a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- золотое кольцо -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#d4b06a" stroke-width="12"/>
</svg>
